packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-winstaller
  - koffi
  - esbuild
  - node-pty

# ssh2 treats cpu-features as an optional acceleration; omitting it keeps
# Electron packaging from rebuilding a nonessential native addon.
ignoredOptionalDependencies:
  - cpu-features

