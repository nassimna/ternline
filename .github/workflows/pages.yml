name: Deploy website

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release desktop packages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.3
  PNPM_VERSION: 10.34.5

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.repository.default_branch || github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify published downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > published-releases.json
          node --experimental-strip-types --input-type=module <<'EOF'
          import { appendFile, readFile } from 'node:fs/promises'
          import { latestPublishedRelease } from './apps/website/src/lib/downloads.ts'
          const releases = JSON.parse(await readFile('published-releases.json', 'utf8'))
          const release = latestPublishedRelease(releases)
          if (!release) throw new Error('No complete published release is available.')
          const published = releases.find(item => item.tag_name === `v${release.version}`)
          const names = new Set(published.assets.map(asset => asset.name))
          const signatureFiles = [
            ...Object.values(release.downloads).map(href => `${href.slice(href.lastIndexOf('/') + 1)}.sig`),
            'ternline.pub'
          ]
          const signatureCount = signatureFiles.filter(name => names.has(name)).length
          if (signatureCount !== 0 && signatureCount !== signatureFiles.length) {
            throw new Error('Release signatures are incomplete.')
          }
          await appendFile(process.env.GITHUB_ENV,
            `WEBSITE_RELEASE_VERSION=${release.version}\nRELEASE_SIGNATURES_AVAILABLE=${signatureCount > 0}\n`)
          console.log(`Website downloads: v${release.version}`)
          EOF
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: pnpm install --filter @ternline/website --filter agent-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm build:website
        env:
          SITE: https://nassimna.github.io
          WEBSITE_BASE_PATH: /ternline/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
