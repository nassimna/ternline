name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:node
      - name: Validate with delegated Linux process containment
        run: >-
          sudo systemd-run --wait --pipe --collect
          --property="User=$(id -un)" --property="Group=$(id -gn)"
          --property=Delegate=yes --working-directory="$PWD"
          /usr/bin/env "PATH=$PATH" "HOME=$HOME" "RUNNER_TEMP=$RUNNER_TEMP" CI=true
          pnpm validate
      - name: Stage desktop accessibility runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          pnpm stage:node:linux
      - name: Validate desktop accessibility
        env:
          AGENT_WORKSPACE_EVIDENCE_DIR: ${{ github.workspace }}/accessibility-evidence
        run: >-
          sudo systemd-run --wait --pipe --collect
          --property="User=$(id -un)" --property="Group=$(id -gn)"
          --property=Delegate=yes --working-directory="$PWD"
          /usr/bin/env "PATH=$PATH" "HOME=$HOME" "RUNNER_TEMP=$RUNNER_TEMP" CI=true
          "AGENT_WORKSPACE_EVIDENCE_DIR=$AGENT_WORKSPACE_EVIDENCE_DIR"
          xvfb-run -a pnpm --filter @agent-workspace/desktop test:a11y
      - name: Upload desktop accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-accessibility-evidence
          path: accessibility-evidence
          if-no-files-found: warn

  windows-runtime:
    name: Windows runtime contracts
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-workspace/protocol-client exec vitest run src/schemas.test.ts -t "cross-platform absolute paths"
      - run: >-
          pnpm --filter @agent-workspace/server exec vitest run
          src/persistence/windows-private-state.test.ts
          src/http/child-ipc-stream.test.ts
